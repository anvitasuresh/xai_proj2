# Stage 1 data: items, stuck messages, counterfactual variants.
seed: 13
paths:
  raw: data/raw
  processed: data/processed

wandb: {enabled: true, project: who-does-the-tutor-learn-from}

items:
  seed: 13
  n_rl_train: 2000   # GRPO training prompts (GSM8K train)
  n_audit: 300       # judge calibration + reward-model audit (GSM8K train, disjoint from rl_train)
  n_test: 300        # held-out tutor evaluation, E5-E7 (GSM8K test)
  min_steps: 2       # need >= 2 steps for the "I did step 1 and got X" message
  max_steps: 6       # roughly middle-school difficulty

variants:
  # Counterfactual student groups. Only the student's message changes; question and reply stay fixed.
  dialect_groups:
    # Every non-MAE group is built from documented grammatical features only. Safeguards against
    # caricature (details and sources in docs/ethics.md):
    #   min_attestation: 1.0  -> only features eWAVE rates "A" (pervasive or obligatory) for the variety
    #   exclude               -> features removed for a stated reason (comment next to each)
    #   feature_prob: 0.5     -> each allowed feature is used in a given message with p = 0.5, so messages
    #                            don't stack every feature at once
    # After native-speaker validation (docs/dialect_validation.md), features flagged as unnatural or
    # stereotyped are added to `exclude` and the variants are rebuilt.
    mae: {kind: identity}   # Mainstream American English (the reference)
    aae:
      kind: multivalue
      dialect: AfricanAmericanVernacular   # eWAVE "Urban African American Vernacular English"
      min_attestation: 1.0
      feature_prob: 0.5
      exclude:
        - yall          # "you" in our messages addresses one tutor; plural y'all would be ungrammatical here
        - fixin_future  # Southern US form that Multi-VALUE maps to the same eWAVE feature (126) as "finna"
    indian:
      kind: multivalue
      dialect: IndianDialect               # eWAVE "Indian English"
      min_attestation: 1.0
      feature_prob: 0.5
      exclude: []
    # L2 English (English learners): not a dialect or an ethnic group, and Multi-VALUE has no learner
    # variety. We use the grammatical morphemes that second-language learners acquire late and most often
    # omit, across many first languages (Dulay & Burt 1974; Goldschneider & DeKeyser 2001): articles,
    # plural -s, third-person -s, past -ed, and auxiliaries in questions. Several also occur in AAE, so
    # the two groups overlap; stage 3 compares features, not just groups.
    l2:
      kind: multivalue_features
      features: [remove_det_definite, remove_det_indefinite, zero_plural, uninflect, drop_aux_yn, bare_past_tense]
      feature_prob: 0.5
  paraphrase_control: true   # MAE rewording, no dialect features (E2 control)
  max_attempts: 3            # re-seed if a probabilistic transform changed nothing
  names:
    file: data/names/names.yaml
    per_gender: 2            # 2 female + 2 male names per group
    splits: [audit, test]    # names are only needed where we audit/evaluate
  hand_check_per_group: 40   # rows per group in the native-speaker rating sheet (docs/dialect_validation.md)
  validation_dir: data/validation

# Native-speaker validation of the dialect variants (docs/dialect_validation.md). Pre-registered rule:
validation:
  min_n: 5                    # judge a feature only once it appears in >= 5 rated rows
  max_stereotyped_rate: 0.2   # drop if >= 20% of ratings call rows with it stereotyped/exaggerated
  min_naturalness: 3.0        # ... or if its mean naturalness is below 3 / 5
  margin_stereotyped: 0.1     # ... and it is worse than rows without the feature by this much
  margin_naturalness: 0.5
